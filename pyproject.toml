[project]
name = "helpdesk-agent"
version = "0.1.0"
description = "Minimal Python agent service template for ArchAI."
requires-python = ">=3.10"
dependencies = [
  # Pinned to the 0.3.x line: the 1.x SDK replaced Pydantic types with raw
  # protobuf messages and removed the FastAPI server app helpers.
  "a2a-sdk>=0.3.0,<0.4",
  # Only exercised when a remote agent is configured with an AgentCore runtime
  # ARN (imported lazily); required in the deployed image.
  "boto3>=1.43.97",
  "fastapi>=0.116.0",
  "fastmcp>=3.4.7",
  "langgraph>=0.2.0",
  "mcp>=1.10.0",
  "openai>=1.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
  "opentelemetry-sdk>=1.30.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "bandit>=1.8.0",
  "hatchling>=1.28.0",
  "httpx>=0.28.0",
  "mypy>=1.16.0",
  "pip-audit>=2.9.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8.0",
  "hatchling>=1.28.0",
  "httpx>=0.28.0",
  "mypy>=1.16.0",
  "pip-audit>=2.9.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[project.scripts]
helpdesk-agent = "helpdesk_agent.main:main"
helpdesk-memory-create = "helpdesk_agent.memory_setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk_agent"]
artifacts = ["src/helpdesk_agent/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "S"]
ignore = [
  "S101",
  "S104",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["helpdesk_agent"]

# boto3/botocore ship no type stubs; imports are lazy (AgentCore transport and
# the Lambda handler) and exercised via tests with fakes.
[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.vercel]
entrypoint = "main:app"

[tool.coverage.run]
source = ["helpdesk_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
