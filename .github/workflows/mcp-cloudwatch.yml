name: CloudWatch MCP Server

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: aios/mcp-cloudwatch
  SOURCE_REPO: https://github.com/awslabs/mcp.git

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone awslabs/mcp source
        run: git clone --depth 1 $SOURCE_REPO mcp-source

      # Upstream image runs the MCP server over stdio (for local Claude/Cursor use);
      # AgentCore Runtime requires it served over streamable-HTTP at 0.0.0.0:8000/mcp instead.
      - name: Patch server to run over streamable-HTTP for AgentCore
        run: |
          cp docker/cloudwatch-mcp-server/run_http.py \
            mcp-source/src/cloudwatch-mcp-server/awslabs/cloudwatch_mcp_server/run_http.py
          sed -i 's#ENTRYPOINT \["awslabs.cloudwatch-mcp-server"\]#ENTRYPOINT ["python3", "-m", "awslabs.cloudwatch_mcp_server.run_http"]#' \
            mcp-source/src/cloudwatch-mcp-server/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ARM64 image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push \
            mcp-source/src/cloudwatch-mcp-server
