name: Agent CICD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-cicd-${{ vars.AGENTCORE_RUNTIME_ID || github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aios/helpdesk-agent' }}
  AGENTCORE_RUNTIME_ID: ${{ vars.AGENTCORE_RUNTIME_ID }}
  DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
  DEEPEVAL_RESULTS_FOLDER: reports/deepeval

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stages: ${{ toJSON(steps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Prepare reports
        run: mkdir -p reports
      - name: Install test dependencies
        id: dependencies
        continue-on-error: true
        run: uv sync --frozen
      - name: Pytest unit tests
        id: tests
        continue-on-error: true
        timeout-minutes: 10
        env:
          COVERAGE_FILE: reports/.coverage.unit
        run: >-
          uv run --frozen --no-sync pytest -m unit --strict-markers
          --junitxml=reports/unit.xml --cov=helpdesk_agent
          --cov-report=term-missing --cov-report=html:reports/htmlcov --cov-fail-under=90
      - name: Upload unit reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cicd-reports-unit
          path: reports/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Integration Tests
    needs: unit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      stages: ${{ toJSON(steps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Prepare reports
        run: mkdir -p reports/integration
      - name: Install test dependencies
        id: dependencies
        continue-on-error: true
        run: uv sync --frozen
      - name: Pytest live integration tests
        id: tests
        continue-on-error: true
        timeout-minutes: 15
        env:
          COVERAGE_FILE: reports/integration/.coverage.integration
          LIVE_INTEGRATION_ENV: ${{ secrets.HELPDESK_AGENT_INTEGRATION_ENV }}
        run: |
          uv run --frozen --no-sync python - <<'PY'
          from io import StringIO
          import os
          import re
          import subprocess
          import sys

          from dotenv.parser import parse_stream

          raw = os.environ.pop("LIVE_INTEGRATION_ENV", "")
          settings = {}
          for binding in parse_stream(StringIO(raw)):
              if binding.error:
                  sys.exit(f"Invalid integration environment syntax at line {binding.original.line}")
              if binding.key is None:
                  continue
              if binding.value is None:
                  sys.exit(f"Expected KEY=value at integration environment line {binding.original.line}")
              if binding.key in settings:
                  sys.exit(f"Duplicate variable at integration environment line {binding.original.line}")
              settings[binding.key] = binding.value
          if not settings:
              sys.exit("HELPDESK_AGENT_INTEGRATION_ENV must contain KEY=value settings")
          aws_keys = {"AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_REGION", "AWS_DEFAULT_REGION"}
          for key, value in settings.items():
              if not re.fullmatch(r"[A-Z][A-Z0-9_]*", key) or (
                  not key.startswith("HELPDESK_AGENT_") and key not in aws_keys
              ):
                  sys.exit("Integration secret contains an unsupported environment variable")
              if not isinstance(value, str) or "\x00" in value:
                  sys.exit("Integration secret values must be strings without null characters")
          for value in settings.values():
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::add-mask::{escaped}", flush=True)
          environment = dict(os.environ)
          environment.update(settings)
          result = subprocess.run([
              "uv", "run", "--frozen", "--no-sync", "pytest", "tests/integration/",
              "-m", "integration", "--live-mcp", "--live-llm", "--strict-markers", "--tb=short",
              "--junitxml=reports/integration/integration.xml", "--cov=helpdesk_agent",
              "--cov-report=term-missing", "--cov-report=html:reports/integration/htmlcov",
              "--cov-report=json:reports/integration/integration-coverage.json",
          ], env=environment, check=False)
          sys.exit(result.returncode)
          PY
      - name: Upload integration reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cicd-reports-integration
          path: reports/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  functional:
    name: Functional Tests
    needs: integration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      stages: ${{ toJSON(steps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Prepare reports
        run: mkdir -p reports/deepeval
      - name: Install evaluation dependencies
        id: dependencies
        continue-on-error: true
        run: uv sync --frozen --group eval
      - name: Validate evaluation metric and dataset
        id: evaluation_checks
        continue-on-error: true
        run: >-
          uv run --frozen --no-sync pytest evaluations/test_triage.py -m unit
          --strict-markers --junitxml=reports/evaluation-checks.xml
      - name: DeepEval testing live tests
        id: tests
        continue-on-error: true
        timeout-minutes: 15
        env:
          HELPDESK_AGENT_LLM_API_KEY: ${{ secrets.HELPDESK_AGENT_LLM_API_KEY }}
          HELPDESK_AGENT_LLM_MODEL: ${{ vars.HELPDESK_AGENT_LLM_MODEL || 'gpt-4o-mini' }}
          HELPDESK_AGENT_LLM_BASE_URL: ${{ vars.HELPDESK_AGENT_LLM_BASE_URL }}
          HELPDESK_AGENT_LLM_TEMPERATURE: ${{ vars.HELPDESK_AGENT_LLM_TEMPERATURE || '0.1' }}
          HELPDESK_AGENT_LLM_TIMEOUT_SECONDS: '30'
          HELPDESK_AGENT_EVAL_SUITE: testing
          PYTEST_ADDOPTS: --junitxml=reports/functional.xml --strict-markers
        run: uv run --frozen --no-sync deepeval test run evaluations/test_triage.py -m functional
      - name: Upload functional reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cicd-reports-functional
          path: reports/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  sonar:
    name: SonarQube
    needs: [unit, integration, functional]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      stages: ${{ toJSON(steps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Prepare reports
        run: mkdir -p reports
      - name: Install coverage tools
        id: dependencies
        continue-on-error: true
        run: uv sync --frozen
      - name: Download unit coverage
        id: unit_coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-cicd-reports-unit
          path: reports/
      - name: Download integration coverage
        id: integration_coverage
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-cicd-reports-integration
          path: reports/
      - name: Combine and export coverage
        id: coverage
        continue-on-error: true
        run: |
          uv run --frozen --no-sync coverage combine --keep reports reports/integration
          uv run --frozen --no-sync coverage xml -o reports/coverage.xml
      - name: SonarQube Cloud code quality
        id: scan
        continue-on-error: true
        timeout-minutes: 10
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cicd-reports-sonar
          path: reports/coverage.xml
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  sca:
    name: Snyk SCA
    needs: sonar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      stages: ${{ toJSON(steps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Prepare reports
        run: mkdir -p reports
      - name: Set up Node for Snyk
        id: node
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Snyk CLI
        id: snyk_setup
        continue-on-error: true
        timeout-minutes: 5
        run: npm install --global snyk@1.1307.4
      - name: Prepare locked production dependencies for SCA
        id: dependencies
        continue-on-error: true
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o reports/requirements.lock.txt
          uv venv .snyk-venv --seed --python 3.12
          uv pip sync --python .snyk-venv/bin/python reports/requirements.lock.txt
          uv pip install --python .snyk-venv/bin/python 'setuptools<81'
          .snyk-venv/bin/python -c 'import pip, pkg_resources'
          .snyk-venv/bin/python -m pip check
          .snyk-venv/bin/python -m pip freeze --exclude pip --exclude setuptools --exclude wheel > reports/requirements.txt
      - name: Snyk SCA
        id: scan
        continue-on-error: true
        timeout-minutes: 10
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_CFG_ORG: ${{ vars.SNYK_ORG }}
        run: |
          set +e
          snyk test --file=reports/requirements.txt --package-manager=pip \
            --command=.snyk-venv/bin/python --json-file-output=reports/snyk-sca.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cicd-reports-sca
          path: reports/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  sast:
    name: Snyk SAST
    needs: sca
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      stages: ${{ toJSON(steps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare reports
        run: mkdir -p reports
      - name: Set up Node for Snyk
        id: node
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Snyk CLI
        id: snyk_setup
        continue-on-error: true
        timeout-minutes: 5
        run: npm install --global snyk@1.1307.4
      - name: Snyk SAST
        id: scan
        continue-on-error: true
        timeout-minutes: 10
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_CFG_ORG: ${{ vars.SNYK_ORG }}
        run: |
          set +e
          snyk code test . --json-file-output=reports/snyk-sast.json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cicd-reports-sast
          path: reports/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build Image
    needs: sast
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
      image_artifact: ${{ steps.image.outputs.artifact }}
      archive_sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate deployment configuration
        run: |
          : "${AGENTCORE_RUNTIME_ID:?Set the AGENTCORE_RUNTIME_ID repository variable}"
          : "${ECR_REPOSITORY:?Set an existing ECR repository}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Prepare unique image tag and archive directory
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "artifact=agent-cicd-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and export container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image/image.tar
          tags: ${{ steps.image.outputs.uri }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record archive checksum
        id: checksum
        working-directory: ${{ runner.temp }}/image
        run: |
          sha256sum image.tar > image.tar.sha256
          echo "sha256=$(cut -d ' ' -f1 image.tar.sha256)" >> "$GITHUB_OUTPUT"
      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.artifact }}
          path: ${{ runner.temp }}/image/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  trivy:
    name: Trivy Scan
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      stages: ${{ toJSON(steps) }}
    steps:
      - name: Prepare reports
        run: mkdir -p reports
      - name: Download built image
        id: image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.image_artifact }}
          path: ${{ runner.temp }}/image/
      - name: Verify archive checksum
        id: checksum
        working-directory: ${{ runner.temp }}/image
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: printf '%s  image.tar\n' "$EXPECTED_SHA256" | sha256sum --check -
      - name: Trivy container image scan
        id: scan
        continue-on-error: true
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@0.35.0
        with:
          input: ${{ runner.temp }}/image/image.tar
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/trivy.json
          exit-code: '1'
          timeout: 10m
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-cicd-reports-trivy
          path: reports/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  push:
    name: Push to ECR
    needs: [build, trivy]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.trivy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ needs.build.outputs.image_uri }}
      digest_uri: ${{ steps.push.outputs.digest_uri }}
    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.image_artifact }}
          path: ${{ runner.temp }}/image/
      - name: Verify archive checksum
        working-directory: ${{ runner.temp }}/image
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: printf '%s  image.tar\n' "$EXPECTED_SHA256" | sha256sum --check -
      - name: Load the scanned image
        run: docker load --input "$RUNNER_TEMP/image/image.tar"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push image to Amazon ECR
        id: push
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          docker push "$IMAGE_URI"
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${IMAGE_URI##*:}" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" == sha256:* ]]
          echo "digest_uri=${IMAGE_URI%:*}@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Update AgentCore
    needs: push
    if: ${{ !cancelled() && needs.push.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      runtime_version: ${{ steps.deploy.outputs.runtime_version }}
      runtime_status: ${{ steps.deploy.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update Amazon AgentCore runtime
        id: deploy
        timeout-minutes: 20
        env:
          IMAGE_URI: ${{ needs.push.outputs.image_uri }}
        run: >-
          uv run --frozen --no-dev python scripts/update_agentcore_runtime.py
          --runtime-id "$AGENTCORE_RUNTIME_ID" --region "$AWS_REGION" --image-uri "$IMAGE_URI"

  summary:
    name: Summary
    needs: [unit, integration, functional, sonar, sca, sast, build, trivy, push, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download available reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: agent-cicd-reports-*
          path: reports/
          merge-multiple: true
      - name: Publish pipeline summary
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
          DIGEST_URI: ${{ needs.push.outputs.digest_uri }}
          RUNTIME_VERSION: ${{ needs.deploy.outputs.runtime_version }}
          RUNTIME_STATUS: ${{ needs.deploy.outputs.runtime_status }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          results = json.loads(os.environ['JOB_RESULTS'])
          names = ['unit', 'integration', 'functional', 'sonar', 'sca', 'sast',
                   'build', 'trivy', 'push', 'deploy']
          lines = ['## Agent CICD', '', 'Tests and scans are advisory; failures do not block deployment.',
                   '', '| Job / stage | Outcome |', '| --- | --- |']
          for name in names:
              job = results[name]
              lines.append(f"| {name} | {job['result']} |")
              stages = job.get('outputs', {}).get('stages', '')
              for stage, step in json.loads(stages or '{}').items():
                  outcome = step.get('outcome', 'not run')
                  code = step.get('outputs', {}).get('exit_code')
                  if code:
                      detail = {'0': 'no findings', '1': 'findings', '2': 'scanner/configuration error',
                                '3': 'no supported project'}.get(code, 'tool error')
                      outcome += f' ({detail}, exit {code})'
                  lines.append(f'| {name}.{stage} | {outcome} |')
          report = Path('reports/trivy.json')
          if report.exists():
              try:
                  data = json.loads(report.read_text())
                  counts = Counter(v['Severity'] for r in data.get('Results', [])
                                   for v in r.get('Vulnerabilities', []) or [])
                  lines += ['', f'Trivy vulnerability counts: {dict(counts)}']
              except (ValueError, KeyError):
                  lines += ['', 'Trivy report could not be parsed; inspect the scan logs.']
          else:
              lines += ['', 'Trivy report unavailable; the image has not been verified clean.']
          if any(results[name]['result'] != 'success' for name in ['unit', 'integration']):
              lines += ['', 'A test job failed; coverage may be partial or unavailable.']
          for label, key in [('Image', 'IMAGE_URI'), ('Pushed digest', 'DIGEST_URI'),
                             ('Runtime', 'AGENTCORE_RUNTIME_ID'), ('New version', 'RUNTIME_VERSION'),
                             ('Runtime status', 'RUNTIME_STATUS')]:
              lines.append(f"{label}: `{os.environ.get(key) or 'unavailable'}`")
          lines += ['', 'Reports: download the per-stage agent-cicd-reports-* artifacts from this run.',
                    f"[Run and artifacts]({os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                    f"/actions/runs/{os.environ['GITHUB_RUN_ID']})"]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          PY