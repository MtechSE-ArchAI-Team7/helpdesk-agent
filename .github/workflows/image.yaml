name: Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    permissions:
      contents: read
    uses: ./.github/workflows/docker-build-push-ecr.yaml
    with:
      aws-region: ap-southeast-1
      # Replace this with the ECR repository assigned to the cloned agent repo.
      ecr-repository: aios/helpdesk-agent
      extra-tags: ${{ github.ref_name }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
