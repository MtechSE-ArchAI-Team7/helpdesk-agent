name: Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-build-push-ecr.yaml@main
    with:
      aws-region: ap-southeast-1
      # Replace this with the ECR repository assigned to the cloned agent repo.
      ecr-repository: aios/helpdesk-agent
      extra-tags: ${{ github.ref_name }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
